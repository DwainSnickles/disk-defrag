name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout Disk Defrag
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "DiskDefrag.csproj"

      - name: Build
        run: dotnet build "DiskDefrag.csproj" -c Release --no-restore

      # Self-contained single file so the artifact runs on a machine with no .NET installed.
      - name: Publish Disk Defrag
        run: >
          dotnet publish "DiskDefrag.csproj" -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -o staging/diskdefrag

      - name: Upload portable binaries
        uses: actions/upload-artifact@v4
        with:
          name: Disk-Defrag-win-x64
          path: staging/diskdefrag
          if-no-files-found: error
